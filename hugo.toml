baseURL = 'https://blog.777157.xyz/'
theme = 'PaperMod'
defaultContentLanguage = 'en'

enableInlineShortcodes = true
enableRobotsTXT = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[pagination]
  pagerSize = 10
  
[services]
  [services.googleAnalytics]
    ID = "G-YS4DXJ24QT"

# 语言无关的全局参数
[params]
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  ShowAllPagesInArchive = true
  ShowPageNums = true
  disableSpecial1stPost = true
  ShowToc = true
  TocOpen = true
  disableHLJS = true
  linkFullImages = true

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/"

  [[params.editPost]]
    URL = "https://github.com/"
    Text = "Suggest Changes"

###############################
# 中文
###############################
[languages.zh-cn]
  languageCode = 'zh-cn'
  languageName = '中文'
  title = '运维故障研究所'
  weight = 2
  contentDir = 'content-zh'

  [languages.zh-cn.params]
    description = "记录生产环境真实故障，专注 Kubernetes、存储、网络、Linux 与云原生排障复盘。"

  [languages.zh-cn.menu]
    [[languages.zh-cn.menu.main]]
      identifier = "archives"
      name = "归档"
      url = "/zh-cn/archives/"
      weight = 10
    [[languages.zh-cn.menu.main]]
      identifier = "search"
      name = "搜索"
      url = "/zh-cn/search/"
      weight = 20
    [[languages.zh-cn.menu.main]]
      identifier = "tags"
      name = "标签"
      url = "/zh-cn/tags/"
      weight = 30

###############################
# English
###############################
[languages.en]
  languageCode = 'en-us'
  languageName = 'English'
  title = 'FaultLab'
  weight = 1
  contentDir = 'content/en'

  [languages.en.params]
    description = "Real incidents. Production failures. Kubernetes, storage, networking, and cloud operations."

  [languages.en.menu]
    [[languages.en.menu.main]]
      identifier = "archives"
      name = "Archives"
      url = "/archives/"
      weight = 10
    [[languages.en.menu.main]]
      identifier = "search"
      name = "Search"
      url = "/search/"
      weight = 20
    [[languages.en.menu.main]]
      identifier = "tags"
      name = "Tags"
      url = "/tags/"
      weight = 30
