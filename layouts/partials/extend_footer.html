{{- if (.Param "ShowToc") }}
<style>
.toc a.active {
  color: var(--primary) !important;
  font-weight: 700 !important;
  border-left: 3px solid var(--primary);
  padding-left: calc(1rem - 3px);
  margin-left: -1rem;
}
</style>
<script>
(function() {
  var headings = document.querySelectorAll('.post-content h2, .post-content h3');
  var links = document.querySelectorAll('.toc a');
  if (!headings.length || !links.length) return;
  var linkMap = {};
  links.forEach(function(a) {
    var h = a.getAttribute('href');
    if (!h || h[0] !== '#') return;
    try { linkMap[decodeURIComponent(h.slice(1))] = a; }
    catch(e) { linkMap[h.slice(1)] = a; }
  });
  var observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        links.forEach(function(l) { l.classList.remove('active'); });
        var link = linkMap[entry.target.id];
        if (link) link.classList.add('active');
      }
    });
  }, { rootMargin: '-80px 0px -60% 0px' });
  headings.forEach(function(h) { observer.observe(h); });
})();
</script>
{{- end }}
<script>
(function() {
  var carousel = document.getElementById('carousel');
  if (!carousel) return;
  var inner = carousel.querySelector('.carousel-inner');
  var slides = carousel.querySelectorAll('.carousel-slide');
  var dots = carousel.querySelectorAll('.carousel-dot');
  if (!slides.length) return;
  var current = 0;
  var timer;
  function show(n) {
    slides.forEach(function(s) { s.classList.remove('active'); });
    dots.forEach(function(d) { d.classList.remove('active'); });
    current = (n + slides.length) % slides.length;
    slides[current].classList.add('active');
    dots[current].classList.add('active');
    inner.style.transform = 'translateX(-' + (current * 100) + '%)';
  }
  function autoPlay() { timer = setInterval(function() { show(current + 1); }, 5000); }
  window.moveCarousel = function(dir) { show(current + dir); resetTimer(); };
  window.goToSlide = function(n) { show(n); resetTimer(); };
  function resetTimer() { clearInterval(timer); autoPlay(); }
  autoPlay();
  carousel.addEventListener('mouseenter', function() { clearInterval(timer); });
  carousel.addEventListener('mouseleave', function() { autoPlay(); });
})();
</script>
