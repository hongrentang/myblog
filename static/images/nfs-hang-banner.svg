<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#ff6b6b"/>
    </linearGradient>
    <linearGradient id="hang" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#e94560;stop-opacity:0.1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="340" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="4" fill="url(#accent)"/>
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="85" x2="800" y2="85"/>
    <line x1="0" y1="170" x2="800" y2="170"/>
    <line x1="0" y1="255" x2="800" y2="255"/>
    <line x1="200" y1="0" x2="200" y2="340"/>
    <line x1="400" y1="0" x2="400" y2="340"/>
    <line x1="600" y1="0" x2="600" y2="340"/>
  </g>
  <!-- NFS Client -->
  <rect x="40" y="60" width="160" height="80" rx="6" fill="#16213e" stroke="#e94560" stroke-width="1.5" opacity="0.9"/>
  <text x="120" y="92" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="12" font-weight="bold">NFS Client</text>
  <text x="120" y="112" text-anchor="middle" fill="#888" font-family="monospace" font-size="9">App → mount -t nfs</text>
  <text x="120" y="128" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="9" filter="url(#glow)">D state / hung</text>
  <!-- X mark -->
  <text x="215" y="105" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="24" font-weight="bold">✗</text>
  <!-- NFS Server -->
  <rect x="240" y="60" width="160" height="80" rx="6" fill="#1a1a2e" stroke="#555" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="320" y="92" text-anchor="middle" fill="#666" font-family="monospace" font-size="12" font-weight="bold">NFS Server</text>
  <text x="320" y="112" text-anchor="middle" fill="#666" font-family="monospace" font-size="9">Down / Unreachable</text>
  <text x="320" y="128" text-anchor="middle" fill="#666" font-family="monospace" font-size="9">10.0.0.100:/data</text>
  <!-- Process tree (D state) -->
  <rect x="440" y="40" width="320" height="150" rx="6" fill="none" stroke="#e94560" stroke-opacity="0.3" stroke-width="1"/>
  <text x="600" y="62" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="10">/proc/*/status — State: D</text>
  <rect x="460" y="75" width="130" height="22" rx="3" fill="#e94560" opacity="0.15"/>
  <text x="490" y="90" fill="#e94560" font-family="monospace" font-size="9">app-server-1     D</text>
  <rect x="460" y="102" width="130" height="22" rx="3" fill="#e94560" opacity="0.15"/>
  <text x="490" y="117" fill="#e94560" font-family="monospace" font-size="9">app-server-2     D</text>
  <rect x="460" y="129" width="130" height="22" rx="3" fill="#e94560" opacity="0.12"/>
  <text x="490" y="144" fill="#e94560" font-family="monospace" font-size="9">sshd            D</text>
  <rect x="460" y="156" width="130" height="22" rx="3" fill="#e94560" opacity="0.08"/>
  <text x="490" y="171" fill="#e94560" font-family="monospace" font-size="9">kubelet         D</text>
  <!-- What happened -->
  <rect x="610" y="75" width="140" height="60" rx="4" fill="#1a1a2e" stroke="#333" stroke-width="1"/>
  <text x="680" y="95" text-anchor="middle" fill="#888" font-family="monospace" font-size="8">NFS I/O stuck</text>
  <text x="680" y="112" text-anchor="middle" fill="#888" font-family="monospace" font-size="8">kernel can't</text>
  <text x="680" y="129" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="8">force-kill</text>
  <!-- Bottom text -->
  <rect x="80" y="220" width="640" height="2" rx="1" fill="#e94560" opacity="0.3"/>
  <text x="400" y="260" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="20" font-weight="bold">NFS Hang · D State · Storage</text>
  <text x="400" y="285" text-anchor="middle" fill="#e94560" font-family="monospace" font-size="12">NFS 服务器宕机后，客户端进程全部卡死</text>
  <text x="400" y="308" text-anchor="middle" fill="#666" font-family="monospace" font-size="10" font-weight="bold">Nobody can kill the unkillable · 包括 SSH 和 kubelet</text>
</svg>
