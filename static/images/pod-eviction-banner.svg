<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="50%" style="stop-color:#2d1b4e"/>
      <stop offset="100%" style="stop-color:#0d0a1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#c0392b"/>
    </linearGradient>
    <linearGradient id="pressure" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:0.3"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="340" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="4" fill="url(#accent)"/>
  <!-- Grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="160" y1="0" x2="160" y2="340"/>
    <line x1="320" y1="0" x2="320" y2="340"/>
    <line x1="480" y1="0" x2="480" y2="340"/>
    <line x1="640" y1="0" x2="640" y2="340"/>
  </g>
  <!-- Node box -->
  <rect x="50" y="60" width="180" height="200" rx="8" fill="none" stroke="#ff6b6b" stroke-width="1.5" opacity="0.4"/>
  <text x="140" y="45" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="11" opacity="0.7">K8s Node</text>
  <!-- Pressure gauge -->
  <rect x="70" y="80" width="60" height="160" rx="4" fill="#1a1a2e" stroke="#333" stroke-width="1"/>
  <rect x="70" y="180" width="60" height="60" rx="4" fill="url(#pressure)"/>
  <text x="100" y="260" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="10">Disk Pressure</text>
  <!-- Evicted pods -->
  <rect x="150" y="85" width="65" height="30" rx="3" fill="#ff6b6b" opacity="0.2" stroke="#ff6b6b" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="182" y="103" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="8" opacity="0.7">EVICTED</text>
  <rect x="150" y="125" width="65" height="30" rx="3" fill="#ff6b6b" opacity="0.2" stroke="#ff6b6b" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="182" y="143" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="8" opacity="0.7">EVICTED</text>
  <rect x="150" y="165" width="65" height="30" rx="3" fill="#ff6b6b" opacity="0.2" stroke="#ff6b6b" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="182" y="183" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="8" opacity="0.7">EVICTED</text>
  <rect x="150" y="205" width="65" height="30" rx="3" fill="#333" stroke="#555" stroke-width="1"/>
  <text x="182" y="223" text-anchor="middle" fill="#888" font-family="monospace" font-size="7">Running</text>
  <!-- Kubelet icon -->
  <text x="430" y="90" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="13" font-weight="bold">kubelet</text>
  <text x="430" y="108" text-anchor="middle" fill="#c0392b" font-family="monospace" font-size="10">─ Eviction Manager ─</text>
  <!-- Eviction criteria -->
  <rect x="305" y="125" width="250" height="90" rx="4" fill="#1a1a2e" stroke="#333" stroke-width="1"/>
  <text x="330" y="145" fill="#888" font-family="monospace" font-size="9">nodefs.available &lt; 10%  ✗</text>
  <text x="330" y="162" fill="#888" font-family="monospace" font-size="9">memory.available &lt; 100Mi ✓</text>
  <text x="330" y="179" fill="#ff6b6b" font-family="monospace" font-size="9" filter="url(#glow)">nodefs.inodesFree &lt; 5%   ✗</text>
  <text x="330" y="196" fill="#888" font-family="monospace" font-size="9">imagefs.available &lt; 15% ✓</text>
  <!-- Log icon -->
  <rect x="590" y="125" width="160" height="90" rx="4" fill="#1a1a2e" stroke="#333" stroke-width="1"/>
  <text x="670" y="145" text-anchor="middle" fill="#c0392b" font-family="monospace" font-size="9">/var/log/pods/</text>
  <text x="670" y="162" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="9" font-weight="bold">45GB container logs</text>
  <text x="670" y="179" text-anchor="middle" fill="#888" font-family="monospace" font-size="9">containers 500+ rotate 0</text>
  <text x="670" y="196" text-anchor="middle" fill="#888" font-family="monospace" font-size="9">no log rotation configured</text>
  <!-- Title -->
  <text x="400" y="290" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="22" font-weight="bold">Pod Eviction</text>
  <text x="400" y="316" text-anchor="middle" fill="#ff6b6b" font-family="monospace" font-size="13">当 kubelet 决定你的 Pod 不配存在</text>
</svg>
