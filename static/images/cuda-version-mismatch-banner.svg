<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="50%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0a1628"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#76b900"/>
      <stop offset="100%" style="stop-color:#4a7c00"/>
    </linearGradient>
    <linearGradient id="cuda" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#76b900;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#76b900;stop-opacity:0.05"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="800" height="340" fill="url(#bg)"/>
  <rect x="0" y="0" width="800" height="4" fill="url(#accent)"/>
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="85" x2="800" y2="85"/><line x1="0" y1="170" x2="800" y2="170"/>
    <line x1="0" y1="255" x2="800" y2="255"/><line x1="200" y1="0" x2="200" y2="340"/>
    <line x1="400" y1="0" x2="400" y2="340"/><line x1="600" y1="0" x2="600" y2="340"/>
  </g>
  <!-- Container box -->
  <rect x="40" y="40" width="180" height="120" rx="8" fill="url(#cuda)" stroke="#76b900" stroke-width="1.5"/>
  <text x="130" y="65" text-anchor="middle" fill="#76b900" font-family="monospace" font-size="11" font-weight="bold">Container</text>
  <text x="130" y="85" text-anchor="middle" fill="#76b900" font-family="monospace" font-size="10">CUDA Toolkit 12.2</text>
  <text x="130" y="105" text-anchor="middle" fill="#76b900" font-family="monospace" font-size="10">PyTorch 2.1.0</text>
  <text x="130" y="125" text-anchor="middle" fill="#76b900" font-family="monospace" font-size="10">cuDNN 8.9</text>
  <text x="130" y="145" text-anchor="middle" fill="#888" font-family="monospace" font-size="9">nvcc --version → release 12.2</text>
  <!-- X -->
  <text x="240" y="105" text-anchor="middle" fill="#ff4444" font-family="monospace" font-size="22" font-weight="bold">✗</text>
  <!-- Driver box -->
  <rect x="270" y="40" width="180" height="120" rx="8" fill="none" stroke="#ff4444" stroke-width="1.5"/>
  <text x="360" y="65" text-anchor="middle" fill="#ff4444" font-family="monospace" font-size="11" font-weight="bold">Host Driver</text>
  <text x="360" y="85" text-anchor="middle" fill="#ff4444" font-family="monospace" font-size="10">NVIDIA Driver 525</text>
  <text x="360" y="105" text-anchor="middle" fill="#ff4444" font-family="monospace" font-size="10">CUDA Version: 12.0</text>
  <text x="360" y="125" text-anchor="middle" fill="#ff4444" font-family="monospace" font-size="10">A100 80GB × 4</text>
  <text x="360" y="145" text-anchor="middle" fill="#888" font-family="monospace" font-size="9">nvidia-smi → CUDA Version: 12.0</text>
  <!-- Error message -->
  <rect x="490" y="40" width="270" height="60" rx="4" fill="#1a0000" stroke="#ff4444" stroke-width="1"/>
  <text x="625" y="62" text-anchor="middle" fill="#ff4444" font-family="monospace" font-size="10" font-weight="bold" filter="url(#glow)">CUDA driver version is</text>
  <text x="625" y="82" text-anchor="middle" fill="#ff4444" font-family="monospace" font-size="10" font-weight="bold" filter="url(#glow)">insufficient for CUDA runtime</text>
  <!-- CUDA version bar -->
  <rect x="490" y="115" width="270" height="50" rx="4" fill="none" stroke="#333" stroke-width="1"/>
  <text x="625" y="133" text-anchor="middle" fill="#888" font-family="monospace" font-size="9">Driver SUPPORTED cuda  Driver version</text>
  <rect x="510" y="142" width="80" height="10" rx="2" fill="#76b900" opacity="0.6"/>
  <rect x="510" y="142" width="50" height="10" rx="2" fill="#76b900"/>
  <text x="555" y="150" text-anchor="middle" fill="#fff" font-family="monospace" font-size="7" font-weight="bold">12.0</text>
  <text x="600" y="150" fill="#ff4444" font-family="monospace" font-size="8">Container: 12.2</text>
  <!-- Title -->
  <text x="400" y="240" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="22" font-weight="bold">CUDA Version Mismatch</text>
  <text x="400" y="265" text-anchor="middle" fill="#76b900" font-family="monospace" font-size="13">容器 CUDA 版本比 NVIDIA 驱动还新</text>
  <text x="400" y="295" text-anchor="middle" fill="#666" font-family="monospace" font-size="11">nvidia-smi 能识别 GPU，但 CUDA 程序就是跑不起来</text>
</svg>
